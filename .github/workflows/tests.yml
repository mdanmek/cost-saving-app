name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ['2.2.*', '3.*']   # Pyodide (stlite) ships pandas 2.x; local installs get 3.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # Pyodide 0.29 (stlite 1.10) runs Python 3.13
      - run: pip install "pandas==${{ matrix.pandas }}" "openpyxl>=3.1" pytest
      - run: python -m pytest -q
